name: Maintenance PDF Lock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maintenance-pdf-lock.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Generate canonical PDF.js lockfile
        run: npm install --package-lock-only --ignore-scripts --save-exact pdfjs-dist@6.3.289
      - name: Verify dependency lock
        run: |
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.dependencies['pdfjs-dist']!=='6.3.289'||l.packages['node_modules/pdfjs-dist']?.version!=='6.3.289') process.exit(1)"
      - name: Commit canonical dependency lock
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'build: pin pdfjs parser dependency'
          git push origin HEAD:main
