name: Maintenance PDF Lock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maintenance-pdf-lock.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Generate canonical PDF.js lockfile
        run: npm install --package-lock-only --ignore-scripts --save-exact pdfjs-dist@6.3.289
      - name: Verify dependency lock
        run: |
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.dependencies['pdfjs-dist']!=='6.3.289'||l.packages['node_modules/pdfjs-dist']?.version!=='6.3.289') process.exit(1)"
      - uses: actions/upload-artifact@v4
        with:
          name: pdfjs-lockfiles
          path: |
            package.json
            package-lock.json
          retention-days: 1
