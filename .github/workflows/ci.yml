name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: medatlas-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run validate:db-contract
      - run: npm run validate:organization-runtime
      - run: npm run validate:publication-identity
      - run: npm run validate:repository-boundary
      - run: npm run validate:share-revocation
      - run: npm run validate:anatomy-contract
      - run: npm run validate:demo-scenarios
      - run: npm run validate:vendored-assets
      - run: npm run validate:performance-budget
      - run: npm run validate:security-contract
      - run: npm run validate:ai-contract
      - run: npm run validate:review-gate
      - run: npm run validate:report-workflow
      - run: npm run validate:license-attribution
      - run: npm run validate:reference-atlas
      - run: npm run validate:mvp-ui
      - run: npm run check
      - run: npm run build
      - run: npm run validate:bundle-budget
