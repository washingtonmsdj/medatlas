name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run validate:db-contract
      - run: npm run validate:anatomy-contract
      - run: npm run validate:demo-scenarios
      - run: npm run validate:vendored-assets
      - run: npm run validate:performance-budget
      - run: npm run check
      - run: npm run build
