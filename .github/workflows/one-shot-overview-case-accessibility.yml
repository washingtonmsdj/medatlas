name: One-shot overview case accessibility

on:
  push:
    branches:
      - fix/overview-case-accessibility

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix semantic progress and next-action contrast
        run: |
          python - <<'PY'
          from pathlib import Path

          overview_path = Path('src/components/Overview.tsx')
          overview = overview_path.read_text()
          old_progress = "                <div className=\"overview-case-progress-bar\" aria-label={`${presentation.progressPercent}% do fluxo concluído`}>\n                  <span style={{ width: `${presentation.progressPercent}%` }} />\n                </div>"
          new_progress = "                <div\n                  className=\"overview-case-progress-bar\"\n                  role=\"progressbar\"\n                  aria-label=\"Progresso do relatório\"\n                  aria-valuemin={0}\n                  aria-valuemax={100}\n                  aria-valuenow={presentation.progressPercent}\n                >\n                  <span style={{ width: `${presentation.progressPercent}%` }} />\n                </div>"
          if overview.count(old_progress) != 1:
              raise SystemExit(f'expected one progress block, found {overview.count(old_progress)}')
          overview_path.write_text(overview.replace(old_progress, new_progress, 1))

          css_path = Path('src/styles/overview-case.css')
          css = css_path.read_text()
          old_css = ".overview-case-patient span,\n.overview-next-action span {\n  color: var(--text-muted);\n  font-size: 9px;\n  font-weight: 800;\n  letter-spacing: .12em;\n}\n"
          new_css = ".overview-case-patient span {\n  color: var(--text-muted);\n  font-size: 9px;\n  font-weight: 800;\n  letter-spacing: .12em;\n}\n\n.overview-next-action > span {\n  color: var(--text-secondary);\n  font-size: 10px;\n  font-weight: 800;\n  letter-spacing: .12em;\n}\n"
          if css.count(old_css) != 1:
              raise SystemExit(f'expected one shared label block, found {css.count(old_css)}')
          css_path.write_text(css.replace(old_css, new_css, 1))
          PY
          git diff --check
          git diff -- src/components/Overview.tsx src/styles/overview-case.css
      - name: Remove one-shot workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-overview-case-accessibility.yml
          git add src/components/Overview.tsx src/styles/overview-case.css
          git commit -m "fix: make case overview accessible"
          git push origin HEAD:fix/overview-case-accessibility
