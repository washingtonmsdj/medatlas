name: GitHub Pages Preview

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/deployed/**'
      - 'playwright.deployed.config.ts'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Install
        run: npm ci
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build
        run: npm run build
        env:
          VITE_APP_BASE: /medatlas/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Install pinned Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.63.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify published shell and assets
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          node <<'NODE'
          const { createHash } = require('node:crypto')
          const pageUrl = process.env.PAGE_URL

          if (!pageUrl) {
            throw new Error('pages_url_missing')
          }

          async function fetchOk(url, attempts = 6) {
            let lastError

            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              try {
                const response = await fetch(url, {
                  redirect: 'follow',
                  cache: 'no-store',
                })

                if (response.ok) return response
                lastError = new Error(`${url} -> HTTP ${response.status}`)
              } catch (error) {
                lastError = error
              }

              await new Promise((resolve) => setTimeout(resolve, attempt * 1500))
            }

            throw lastError
          }

          const pageResponse = await fetchOk(pageUrl)
          const html = await pageResponse.text()

          if (!html.includes('<div id="root"></div>')) {
            throw new Error('published_root_mount_missing')
          }

          const assetRefs = [
            ...html.matchAll(/<(?:script|link)[^>]+(?:src|href)="([^"]+)"/g),
          ]
            .map((match) => match[1])
            .filter((value) => /\.(?:js|css)(?:\?|$)/.test(value))

          if (assetRefs.length < 2) {
            throw new Error('published_js_css_assets_missing')
          }

          for (const ref of assetRefs) {
            const assetUrl = new URL(ref, pageUrl)
            const response = await fetchOk(assetUrl)
            const length = Number(response.headers.get('content-length') ?? '0')

            if (length === 0) {
              const bytes = new Uint8Array(await response.arrayBuffer())
              if (bytes.byteLength === 0) {
                throw new Error(`empty_published_asset:${assetUrl}`)
              }
            }
          }

          const provenanceUrl = new URL('atlas-assets/PROVENANCE.json', pageUrl)
          const provenanceResponse = await fetchOk(provenanceUrl)
          const provenance = await provenanceResponse.json()

          if (!provenance || typeof provenance !== 'object') {
            throw new Error('published_atlas_provenance_invalid')
          }

          const atlasResponse = await fetchOk(
            new URL('atlas-assets/atlas.json', pageUrl),
          )
          const atlasText = await atlasResponse.text()

          if (atlasText.length < 100000) {
            throw new Error('published_atlas_index_too_small')
          }

          const organManifestResponse = await fetchOk(
            new URL('organ-models/manifest.json', pageUrl),
          )
          const organManifest = await organManifestResponse.json()

          if (
            organManifest?.schema !== 'medatlas.organ-models/1' ||
            organManifest?.upstreamCommit !==
              '8c0e6f321a47f895ae58ce098028b92774733ee9' ||
            !Array.isArray(organManifest?.assets) ||
            organManifest.assets.length !== 9
          ) {
            throw new Error('published_organ_manifest_invalid')
          }

          for (const asset of organManifest.assets) {
            const response = await fetchOk(
              new URL(`organ-models/${asset.file}`, pageUrl),
            )
            const buffer = Buffer.from(await response.arrayBuffer())

            if (
              buffer.length !== asset.bytes ||
              buffer.subarray(0, 4).toString('ascii') !== 'glTF'
            ) {
              throw new Error(`published_organ_asset_invalid:${asset.file}`)
            }

            const digest = createHash('sha256').update(buffer).digest('hex')
            if (digest !== asset.sha256) {
              throw new Error(`published_organ_asset_sha256_mismatch:${asset.file}`)
            }
          }

          console.log(`MedAtlas Pages preview PASS: ${pageUrl}`)
          console.log(
            `Validated ${assetRefs.length} JS/CSS asset(s) + Human Atlas provenance/index + 9 organ GLBs.`,
          )
          NODE

      - name: Verify deployed 3D clinical flow in Chromium
        env:
          MEDATLAS_DEPLOYED_URL: ${{ needs.deploy.outputs.page_url }}
        run: npx playwright test -c playwright.deployed.config.ts --project=chromium
