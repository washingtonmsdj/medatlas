name: One-shot mobile Atlas height fix

on:
  push:
    branches:
      - fix/clareza-mobile-atlas-height

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix mobile Overview 3D viewport height
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/styles/clareza-viva.css')
          css = path.read_text()
          anchor = """  .overview-atlas-stage {
    min-height: 360px;
    padding: 7px;
  }
"""
          replacement = """  .overview-atlas-stage {
    min-height: 420px;
    padding: 7px;
  }

  .overview-atlas-stage .anatomy-focus-preview-compact .anatomy-focus-preview-stage,
  .overview-atlas-stage .anatomy-focus-preview-compact .human-atlas-scene,
  .overview-atlas-stage .anatomy-focus-preview-compact .organ-detail-scene,
  .overview-atlas-stage .focused-reference-loading,
  .overview-atlas-stage .renderer-module-loading {
    min-height: 400px;
  }
"""
          if css.count(anchor) != 1:
              raise SystemExit(f'expected exactly one mobile Atlas anchor, found {css.count(anchor)}')
          path.write_text(css.replace(anchor, replacement, 1))
          PY
          git diff --check
          git diff -- src/styles/clareza-viva.css
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/clareza-viva.css
          git commit -m "fix: preserve mobile overview 3d focus"
          git push origin HEAD:fix/clareza-mobile-atlas-height
