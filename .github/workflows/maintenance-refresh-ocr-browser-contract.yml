name: Refresh OCR browser contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maintenance-refresh-ocr-browser-contract.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply exact browser contract patch
        run: python scripts/maintenance-refresh-ocr-browser-contract.py

      - name: Validate patch
        run: git diff --check

      - name: Commit coverage and remove maintenance transport
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/maintenance-refresh-ocr-browser-contract.yml
          git rm scripts/maintenance-refresh-ocr-browser-contract.py
          git add tests/e2e/report-intake.spec.ts tests/e2e/clinical-flow.spec.ts
          git commit -m 'test: cover bounded local image ocr'
          git push
