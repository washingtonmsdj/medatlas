name: Browser E2E

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'public/atlas-assets/**'
      - '.github/workflows/browser-e2e.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'public/atlas-assets/**'
  workflow_dispatch:

concurrency:
  group: medatlas-browser-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install pinned Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.63.0 @axe-core/playwright@4.13.0

      - name: Install Chromium
        run: |
          # Playwright uses its own Chromium build. The hosted runner's
          # unrelated Google Chrome apt source can temporarily publish an
          # inconsistent index and make --with-deps fail before tests start.
          for source_file in /etc/apt/sources.list.d/*; do
            if [ -f "$source_file" ] && grep -q 'dl.google.com/linux/chrome-stable/deb' "$source_file"; then
              sudo rm -f "$source_file"
            fi
          done
          npx playwright install --with-deps chromium

      - name: Build test target
        run: npm run build

      - name: Run browser E2E
        run: npx playwright test --project=chromium

      - name: Upload visual QA captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-${{ github.run_id }}
          path: test-results/visual-qa/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
