name: Browser E2E

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'scripts/prepare-ocr-assets.mjs'
      - 'public/atlas-assets/**'
      - '.github/workflows/browser-e2e.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'scripts/prepare-ocr-assets.mjs'
      - 'public/atlas-assets/**'
      - '.github/workflows/browser-e2e.yml'
  workflow_dispatch:

concurrency:
  group: medatlas-browser-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chromium:
    name: chromium / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: clinical-flow
            tests: >-
              tests/e2e/clinical-flow.spec.ts
              tests/e2e/synthetic-pilot.spec.ts
              tests/e2e/report-explanation.spec.ts
              tests/e2e/mvp-ux-contracts.spec.ts
              tests/e2e/share-revocation.spec.ts
          - suite: document-ingestion
            tests: >-
              tests/e2e/report-intake.spec.ts
              tests/e2e/scanned-pdf-ocr.spec.ts
          - suite: responsive-layout
            tests: >-
              tests/e2e/responsive-layout.spec.ts
              tests/e2e/mobile-navigation.spec.ts
              tests/e2e/visual-3d-visibility.spec.ts
              tests/e2e/visual-patient-portal-visibility.spec.ts
          - suite: supporting-contracts
            tests: >-
              tests/e2e/accessibility.spec.ts
              tests/e2e/anatomy-depth-layout.spec.ts
              tests/e2e/invitations-contract.spec.ts
              tests/e2e/patient-localization.spec.ts

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install pinned Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.63.0 @axe-core/playwright@4.13.0

      - name: Install Chromium
        run: |
          # Playwright uses its own Chromium build. The hosted runner's
          # unrelated Google Chrome apt source can temporarily publish an
          # inconsistent index and make --with-deps fail before tests start.
          for source_file in /etc/apt/sources.list.d/*; do
            if [ -f "$source_file" ] && grep -q 'dl.google.com/linux/chrome-stable/deb' "$source_file"; then
              sudo rm -f "$source_file"
            fi
          done
          npx playwright install --with-deps chromium

      - name: Build test target
        run: npm run build

      - name: Run browser E2E
        run: npx playwright test ${{ matrix.tests }} --project=chromium

      - name: Upload visual QA captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-${{ github.run_id }}-${{ matrix.suite }}
          path: test-results/visual-qa/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.suite }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
