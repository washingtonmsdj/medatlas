name: One-shot overview test migration

on:
  push:
    branches:
      - chore/overview-test-migration

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align overview tests with semantic Clareza Viva structure
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def sub_once(text: str, pattern: str, replacement: str, label: str, flags: int = 0) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 replacement, got {count}')
              return updated

          responsive_path = Path('tests/e2e/responsive-layout.spec.ts')
          responsive = responsive_path.read_text()
          responsive = sub_once(
              responsive,
              r"  const dashboardProgress = page\.locator\(\n.*?\)\.toContainText\('Publicar ao paciente'\)\n",
              """  const dashboardFlowMetric = page
            .locator('.overview-kpi-card')
            .filter({ hasText: 'Fluxo concluído' })
          await expect(dashboardFlowMetric.locator('strong')).toHaveText('75%')

          const currentOverviewStep = page
            .locator('.overview-flow-list > button')
            .filter({ has: page.locator('.overview-status-pill.current') })
          await expect(currentOverviewStep).toContainText('Publicar ao paciente')
          await expect(currentOverviewStep).toContainText('Em revisão')
          """,
              'responsive dashboard hierarchy',
              re.S,
          )
          responsive = responsive.replace('.continue-care-card', '.overview-atlas-panel')
          if '.continue-care-card' in responsive or '.care-progress' in responsive:
              raise SystemExit('responsive legacy overview selector remains')
          responsive_path.write_text(responsive)

          clinical_path = Path('tests/e2e/clinical-flow.spec.ts')
          clinical = clinical_path.read_text()
          if clinical.count("'.continue-care-card .anatomy-focus-preview'") != 1:
              raise SystemExit('clinical contextual 3D selector count changed')
          clinical = clinical.replace(
              "'.continue-care-card .anatomy-focus-preview'",
              "'.overview-atlas-panel .anatomy-focus-preview'",
              1,
          )
          clinical = sub_once(
              clinical,
              r"test\('dashboard progress follows the current report'.*?\n\}\)\n(?=\n\ntest\('demo settings can clear local patient shares')",
              """test('overview completion follows the current report', async ({ page }) => {
            await page.goto('/')

            await expect(
              page.getByRole('heading', { name: 'Atendimento em andamento' }),
            ).toBeVisible()

            const flowMetric = page
              .locator('.overview-kpi-card')
              .filter({ hasText: 'Fluxo concluído' })
            await expect(flowMetric.locator('strong')).toHaveText('75%')

            await startNewReportThroughSearch(page)
            await page
              .locator('.clinical-sidebar nav')
              .getByRole('button', { name: 'Visão geral', exact: true })
              .click()

            await expect(flowMetric.locator('strong')).toHaveText('0%')
          })
          """,
              'clinical overview progress state',
              re.S,
          )
          if '.continue-care-card' in clinical or '.care-progress' in clinical:
              raise SystemExit('clinical-flow legacy overview selector remains')
          clinical_path.write_text(clinical)

          deployed_path = Path('tests/deployed/preview.spec.ts')
          deployed = deployed_path.read_text()
          old_selector = "selector: '.continue-care-card .anatomy-focus-preview'"
          if deployed.count(old_selector) != 1:
              raise SystemExit('deployed overview contextual 3D selector count changed')
          deployed = deployed.replace(
              old_selector,
              "selector: '.overview-atlas-panel .anatomy-focus-preview'",
              1,
          )
          if '.continue-care-card' in deployed:
              raise SystemExit('deployed preview legacy overview selector remains')
          deployed_path.write_text(deployed)
          PY

          git diff --check
          git diff -- tests/e2e/responsive-layout.spec.ts tests/e2e/clinical-flow.spec.ts tests/deployed/preview.spec.ts
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/responsive-layout.spec.ts tests/e2e/clinical-flow.spec.ts tests/deployed/preview.spec.ts
          git commit -m "test: align overview gates with Clareza Viva"
          git push origin HEAD:chore/overview-test-migration
