name: One-shot Overview canvas fill

on:
  push:
    branches:
      - fix/overview-canvas-fill

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make Overview Human Atlas fill its real 3D stage
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('src/styles/clareza-viva.css')
          css = css_path.read_text()
          anchor = ".overview-atlas-stage > .anatomy-focus-preview {\n  height: 100%;\n  overflow: hidden;\n  border-color: var(--line-control);\n  border-radius: 12px;\n  background: var(--surface-panel);\n  box-shadow: none;\n}\n"
          addition = "\n.overview-atlas-stage .human-atlas-scene,\n.overview-atlas-stage .reference-atlas-scene {\n  position: absolute;\n  inset: 0;\n  width: 100%;\n  height: 100%;\n}\n\n.overview-atlas-stage .reference-atlas-scene canvas {\n  display: block;\n  width: 100%;\n  height: 100%;\n}\n"
          if css.count(anchor) != 1:
              raise SystemExit(f'expected one Overview preview anchor, found {css.count(anchor)}')
          if '.overview-atlas-stage .reference-atlas-scene {' in css:
              raise SystemExit('Overview scene fill contract already exists')
          css_path.write_text(css.replace(anchor, anchor + addition, 1))

          test_path = Path('tests/e2e/responsive-layout.spec.ts')
          test = test_path.read_text()
          anchor = """  const dashboardMobile3dStageBox =
    await dashboardMobile3dStage.boundingBox()
  expect(dashboardMobile3dStageBox).not.toBeNull()
  expect(dashboardMobile3dStageBox!.height).toBeGreaterThanOrEqual(400)

  await expect(
"""
          replacement = """  const dashboardMobile3dHost = page.locator(
    '.overview-atlas-panel .human-atlas-scene .reference-atlas-scene',
  )
  const dashboardMobile3dCanvas = dashboardMobile3dHost.locator('canvas')
  await expect(dashboardMobile3dCanvas).toBeVisible({ timeout: 60_000 })

  const [dashboardMobile3dStageBox, dashboardMobile3dHostBox, dashboardMobile3dCanvasBox] =
    await Promise.all([
      dashboardMobile3dStage.boundingBox(),
      dashboardMobile3dHost.boundingBox(),
      dashboardMobile3dCanvas.boundingBox(),
    ])
  expect(dashboardMobile3dStageBox).not.toBeNull()
  expect(dashboardMobile3dHostBox).not.toBeNull()
  expect(dashboardMobile3dCanvasBox).not.toBeNull()
  expect(dashboardMobile3dStageBox!.height).toBeGreaterThanOrEqual(400)
  expect(dashboardMobile3dHostBox!.height).toBeGreaterThanOrEqual(400)
  expect(dashboardMobile3dCanvasBox!.height).toBeGreaterThanOrEqual(400)
  expect(
    Math.abs(dashboardMobile3dCanvasBox!.height - dashboardMobile3dStageBox!.height),
  ).toBeLessThanOrEqual(1)

  await expect(
"""
          if test.count(anchor) != 1:
              raise SystemExit(f'expected one mobile Overview stage assertion block, found {test.count(anchor)}')
          test_path.write_text(test.replace(anchor, replacement, 1))
          PY
          git diff --check
          git diff -- src/styles/clareza-viva.css tests/e2e/responsive-layout.spec.ts
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/clareza-viva.css tests/e2e/responsive-layout.spec.ts
          git commit -m "fix: make overview 3d canvas fill its stage"
          git push origin HEAD:fix/overview-canvas-fill
