name: One-shot Overview canvas fill

on:
  push:
    branches:
      - fix/overview-canvas-fill

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make Overview Human Atlas fill its real 3D stage
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('src/styles/clareza-viva.css')
          css = css_path.read_text()
          css_anchor = ".overview-atlas-stage > .anatomy-focus-preview {\n  height: 100%;\n  overflow: hidden;\n  border-color: var(--line-control);\n  border-radius: 12px;\n  background: var(--surface-panel);\n  box-shadow: none;\n}\n"
          css_addition = "\n.overview-atlas-stage .human-atlas-scene,\n.overview-atlas-stage .reference-atlas-scene {\n  position: absolute;\n  inset: 0;\n  width: 100%;\n  height: 100%;\n}\n\n.overview-atlas-stage .reference-atlas-scene canvas {\n  display: block;\n  width: 100%;\n  height: 100%;\n}\n"
          if css.count(css_anchor) != 1:
              raise SystemExit(f'expected one Overview preview anchor, found {css.count(css_anchor)}')
          if '.overview-atlas-stage .reference-atlas-scene {' in css:
              raise SystemExit('Overview scene fill contract already exists')
          css_path.write_text(css.replace(css_anchor, css_anchor + css_addition, 1))

          test_path = Path('tests/e2e/responsive-layout.spec.ts')
          test = test_path.read_text()
          test_anchor = "  const dashboardMobile3dStageBox =\n    await dashboardMobile3dStage.boundingBox()\n  expect(dashboardMobile3dStageBox).not.toBeNull()\n  expect(dashboardMobile3dStageBox!.height).toBeGreaterThanOrEqual(400)\n\n  await expect(\n"
          test_replacement = "  const dashboardMobile3dHost = page.locator(\n    '.overview-atlas-panel .human-atlas-scene .reference-atlas-scene',\n  )\n  const dashboardMobile3dCanvas = dashboardMobile3dHost.locator('canvas')\n  await expect(dashboardMobile3dCanvas).toBeVisible({ timeout: 60_000 })\n\n  const [dashboardMobile3dStageBox, dashboardMobile3dHostBox, dashboardMobile3dCanvasBox] =\n    await Promise.all([\n      dashboardMobile3dStage.boundingBox(),\n      dashboardMobile3dHost.boundingBox(),\n      dashboardMobile3dCanvas.boundingBox(),\n    ])\n  expect(dashboardMobile3dStageBox).not.toBeNull()\n  expect(dashboardMobile3dHostBox).not.toBeNull()\n  expect(dashboardMobile3dCanvasBox).not.toBeNull()\n  expect(dashboardMobile3dStageBox!.height).toBeGreaterThanOrEqual(400)\n  expect(dashboardMobile3dHostBox!.height).toBeGreaterThanOrEqual(400)\n  expect(dashboardMobile3dCanvasBox!.height).toBeGreaterThanOrEqual(400)\n  expect(\n    Math.abs(dashboardMobile3dCanvasBox!.height - dashboardMobile3dStageBox!.height),\n  ).toBeLessThanOrEqual(1)\n\n  await expect(\n"
          if test.count(test_anchor) != 1:
              raise SystemExit(f'expected one mobile Overview stage assertion block, found {test.count(test_anchor)}')
          test_path.write_text(test.replace(test_anchor, test_replacement, 1))
          PY
          git diff --check
          git diff -- src/styles/clareza-viva.css tests/e2e/responsive-layout.spec.ts
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/clareza-viva.css tests/e2e/responsive-layout.spec.ts
          git commit -m "fix: make overview 3d canvas fill its stage"
          git push origin HEAD:fix/overview-canvas-fill
