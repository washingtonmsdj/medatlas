name: Refresh ingestion security contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maintenance-refresh-ingestion-security-contract.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Refresh exact ingestion UI invariants
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/validate-security-contract.mjs')
          text = path.read_text()
          replacements = {
              "  'ingestLocalReportFile(file)',": "  'ingestLocalReportFile(file, {',",
              "  'Importar laudo sintético em TXT, MD ou PDF',": "  'Importar laudo sintético em TXT, MD, PDF, PNG ou JPG',",
              "  'Imagem/OCR ainda não é suportado.',": "  'Imagem/OCR do PDF ainda não é suportado.',",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new)
          path.write_text(text)
          PY

          git diff --check

      - name: Commit contract refresh and remove maintenance workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/maintenance-refresh-ingestion-security-contract.yml
          git add scripts/validate-security-contract.mjs
          git commit -m 'test: align security gate with image ocr intake'
          git push
