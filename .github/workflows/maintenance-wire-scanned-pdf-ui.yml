name: Wire scanned PDF OCR UI

on:
  push:
    branches: [main]
    paths:
      - 'scripts/maintenance-wire-scanned-pdf-ui.py'
      - '.github/workflows/maintenance-wire-scanned-pdf-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply scanned PDF OCR UI wiring
        run: python scripts/maintenance-wire-scanned-pdf-ui.py

      - name: Commit source update
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/maintenance-wire-scanned-pdf-ui.py
          git add src/components/ReportIntake.tsx
          git commit -m 'feat: expose bounded scanned pdf ocr progress'
          git push
