name: One-shot OCR dependency lock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maintenance-ocr-dependency-lock.yml'

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Generate canonical npm lock
        run: >-
          npm install --package-lock-only --ignore-scripts --save-exact
          tesseract.js@7.0.0
          @tesseract.js-data/por@1.0.0

      - name: Commit dependency lock
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'Dependency lock already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'build: pin local ocr runtime dependencies'
          git push
